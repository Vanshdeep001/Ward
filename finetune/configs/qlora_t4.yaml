# Kaggle / Colab free tier — a single T4.
#
# T4s are Turing: they have NO bfloat16. Using bf16 here fails or silently degrades, which is the
# most common way to waste an evening on free GPUs. fp16 throughout instead.
#
# Start with the 1.5B. It trains in about half an hour, proves the whole loop, and is the only size
# that will run on an Iris Xe laptop afterwards for the offline demo.

base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: float16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8      # effective batch 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_seq_length: 1024                # 2048 will OOM a T4 at 7B; 1024 covers these prompts
  gradient_checkpointing: true
  fp16: true
  bf16: false
  optim: paged_adamw_8bit
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 25
  save_strategy: steps
  save_steps: 25
  save_total_limit: 2
  load_best_model_at_end: true
  report_to: none
